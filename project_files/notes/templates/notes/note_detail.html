{% extends 'base.html' %}
{% block title %}Sticky Notes - {{ note.title }}{% endblock %}
{% block content %}
<article class="card">
  <h2>{{ note.title }}</h2>
  <p>{{ note.content|linebreaksbr }}</p>
  <p><small>Created at: {{ note.created_at|date:"Y-m-d H:i" }}</small></p>
  <p>
    <a class="button-link" href="{% url 'note_update' pk=note.pk %}">Update Note</a>
    <a class="button-link danger" href="{% url 'note_delete' pk=note.pk %}">Delete Note</a>
    <a href="{% url 'note_list' %}">Back to Notes List</a>
  </p>
</article>
{% endblock %}
